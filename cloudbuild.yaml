steps:
  # Prune unused/dangling Docker images on the worker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['image', 'prune', '-a', '-f']
    
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'wiz/$PROJECT_ID/tasky', '.']
images:
  - 'wiz/$PROJECT_ID/tasky'

# Add this section to fix the error:
logsBucket: 'gs://wiz-cloud-build-logs-tasky'
