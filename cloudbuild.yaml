steps:
  # Prune unused/dangling Docker images on the worker
  #- name: 'gcr.io/cloud-builders/docker'
  #  args: ['image', 'prune', '-a', '-f']
    
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tasky', '.']

#  - name: 'gcr.io/projectsigstore/cosign:v2.4.1' # Adjust version as needed
#    entrypoint: 'cosign'
#    args:
#      - 'sign'
#      - '--key'
#      - 'gcpkms://projects/$PROJECT_ID/locations/us-east4/keyRings/wiz-keyrin/cryptoKeys/wiz-key/versions/1'
#      - 'gcr.io/$PROJECT_ID/tasky'

  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['apply', '-f', 'kubernetes.yaml', '--validate=false']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-east4'     
      - 'CLOUDSDK_CONTAINER_CLUSTER=wiz-cluster' 

   
images:
  - 'gcr.io/$PROJECT_ID/tasky'



# Add this section to fix the error:
logsBucket: 'gs://wiz-cloud-build-logs-tasky'
