apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiz-app-deployment
  labels:
    app: wiz-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wiz-app
  template:
    metadata:
      labels:
        app: wiz-app
    spec:
      containers:
      - name: wiz-app-container
        # Cloud Build can dynamically swap this image tag or you can use a fixed tag
        image: gcr.io/clgcporg10-188/tasky:latest
        env:
          - name: MONGODB_URI
            value: "mongodb://wiz:ThisIsABadIdea1234@10.0.0.2:27017"
          - name: SECRET_KEY
            value: "secret123"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tasky-service
  annotations:
    cloud.google.com/neg: '{"ingress": true}' # 👈 Required for GKE Ingress
  labels:
    app: tasky
spec:
  type: NodePort 
  selector:
    app: tasky
  ports:
    - protocol: TCP
      port: 80   
      targetPort: 8080 
      
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasky-ingress
  annotations:
    # Provisions an External Google Cloud HTTP(S) Load Balancer
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tasky-service
            port:
              number: 80
